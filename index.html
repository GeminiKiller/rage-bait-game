<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>STICKMAN RAGE</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #efece6; color: #1a1a1a;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  #stage {
    position: fixed;
    top: 50%; left: 50%;
    width: 960px; height: 540px;
    transform-origin: center center;
    background: #efece6;
    box-shadow: 0 0 40px rgba(0,0,0,0.15);
  }
  #game {
    display: block;
    width: 960px; height: 540px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #efece6;
  }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: none;
    justify-content: space-between; align-items: flex-start;
    padding: 10px 16px;
    pointer-events: none;
    z-index: 5;
  }
  #hud .hud-levelnum {
    font-size: 15px; font-weight: 700; color: #1a1a1a;
    background: rgba(239,236,230,0.7);
    border-radius: 5px;
    padding: 2px 8px;
  }
  #hud-name {
    position: absolute; left: 50%; top: 10px;
    transform: translateX(-50%);
    font-size: 17px; font-weight: 700; color: #1a1a1a;
    background: rgba(239,236,230,0.85);
    padding: 4px 14px;
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
  }
  #hud-name.show { opacity: 1; transition: opacity 0.15s ease; }
  #hud .deaths {
    font-size: 26px; font-weight: 800; color: #d81e1e;
  }
  #hud-timer { display: none; }
  #toast-death {
    position: absolute; left: 50%; top: 34%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(20,20,20,0.85);
    border: 2px solid #d81e1e;
    color: #fff;
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 20px; font-weight: 700;
    opacity: 0;
    transition: opacity 0.15s, transform 0.15s;
    pointer-events: none;
    z-index: 10;
    white-space: nowrap;
  }
  #toast-death.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  .overlay {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
    background: #efece6;
    text-align: center;
    z-index: 20;
    padding: 20px;
    box-sizing: border-box;
  }
  .overlay.show { display: flex; }
  .title-logo {
    font-size: 56px; font-weight: 900; letter-spacing: 2px;
    color: #d81e1e;
    margin-bottom: 6px;
  }
  .subtle { opacity: 0.6; font-size: 14px; margin-bottom: 18px; color: #1a1a1a; }
  .blink { animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  #level-select {
    display: grid;
    grid-template-columns: repeat(8, 40px);
    gap: 8px;
    margin: 14px 0;
    max-width: 480px;
  }
  #level-select button {
    width: 40px; height: 40px;
    background: #1c1c1c; color: #efece6;
    border: none;
    border-radius: 6px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  #level-select button:hover { background: #d81e1e; }
  #level-select button.locked { opacity: 0.25; cursor: not-allowed; background: #8a8a8a; }
  .stat-line { font-size: 15px; margin: 3px 0; color: #1a1a1a; opacity: 0.75; }
  button.primary {
    margin-top: 16px;
    background: #d81e1e; color: #fff; border: none;
    padding: 10px 22px; border-radius: 8px;
    font-size: 16px; font-weight: 700; cursor: pointer;
  }
  button.primary:hover { background: #b81616; }
  button.secondary {
    margin-top: 10px;
    background: #1c1c1c; color: #efece6; border: none;
    padding: 8px 18px; border-radius: 8px;
    font-size: 14px; cursor: pointer;
  }
  button.secondary:hover { background: #333; }

  #touch-controls {
    position: absolute; inset: 0;
    display: none;
    pointer-events: none;
    z-index: 15;
  }
  #touch-controls.show { display: block; }
  #touch-controls button {
    position: absolute;
    bottom: 24px;
    width: 64px; height: 64px;
    border-radius: 50%;
    background: rgba(20,20,20,0.10);
    border: 2px solid rgba(20,20,20,0.22);
    color: #1a1a1a; font-size: 26px;
    pointer-events: auto;
    touch-action: none;
  }
  #btn-left { left: 24px; }
  #btn-right { left: 100px; }
  #btn-jump { right: 24px; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>

    <div id="hud">
      <div class="hud-levelnum" id="hud-levelnum">1</div>
      <div class="hud-timer" id="hud-timer">00:00</div>
      <div class="deaths" id="hud-deaths">0</div>
    </div>
    <div id="hud-name">1. Level Name</div>

    <div id="toast-death"></div>

    <div id="overlay-title" class="overlay show">
      <div class="title-logo">STICKMAN RAGE</div>
      <div class="subtle blink">click / press any key to start</div>
      <div id="level-select"></div>
      <div class="stat-line">deaths so far: <span id="title-total-deaths">0</span></div>
    </div>

    <div id="overlay-clear" class="overlay">
      <div class="title-logo" style="font-size:38px;color:#1f9d43;">LEVEL CLEAR</div>
    </div>

    <div id="overlay-victory" class="overlay">
      <div class="title-logo" style="font-size:38px;">YOU SURVIVED</div>
      <div class="stat-line" id="victory-deaths">Total deaths: 0</div>
      <div class="stat-line" id="victory-time">Total time: 00:00</div>
      <div class="stat-line" id="victory-levels">Levels cleared: 0</div>
      <button class="primary" id="btn-copy-suffering">COPY YOUR SUFFERING</button>
      <button class="secondary" id="btn-back-title">Back to title</button>
    </div>

    <div id="touch-controls">
      <button id="btn-left">&#9664;</button>
      <button id="btn-right">&#9654;</button>
      <button id="btn-jump">&#10514;</button>
    </div>
  </div>

  <script src="js/audio.js" defer></script>
  <script src="js/engine.js" defer></script>
  <script src="js/levels_a.js" defer onerror="console.warn('levels_a.js not found yet')"></script>
  <script src="js/levels_b.js" defer onerror="console.warn('levels_b.js not found yet')"></script>
  <script src="js/main.js" defer></script>
</body>
</html>
